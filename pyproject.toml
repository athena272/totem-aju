[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "totem-aju"
version = "0.1.0"
description = "Totem de acessibilidade em Libras para turistas surdos em Aracaju"
readme = "README.md"
# Limite inferior: StrEnum (3.11). Limite superior: MediaPipe nao tem wheels
# para 3.13+. O projeto e desenvolvido e validado em 3.12.
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }

[project.scripts]
totem-capture = "totem_aju.cli.capture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["totem_aju", "tests"]
